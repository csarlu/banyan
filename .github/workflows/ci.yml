name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }} - Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Pre-install Neovim (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install dependencies
        run: npm ci

      - name: Code style & formatting check
        run: npm run format:check

      - name: ESLint static analysis
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest test suite
        run: npm test

      - name: Build distribution bundles
        run: npm run build

      - name: NPM Production Dependency Audit (Blocking)
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm audit --omit=dev --audit-level=high

      - name: NPM Full Dependency Audit (Informational)
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm audit || true

      - name: Semgrep Security SAST Scan
        if: runner.os == 'Linux' && matrix.node == 22
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan --config=auto src/

      - name: Trivy Vulnerability & Secret Scan
        if: runner.os == 'Linux' && matrix.node == 22
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'src'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Gitleaks Secret Scan
        if: runner.os == 'Linux' && matrix.node == 22
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
